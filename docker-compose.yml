services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: logs
      POSTGRES_DB: logs
    ports:
      - '5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logs']
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "
      node_modules/.bin/prisma migrate deploy &&
      node_modules/.bin/tsx src/http/server.ts
      "
    environment:
      DATABASE_URL: postgresql://logs:logs@postgres:5432/logs
      API_PORT: 3333
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - api

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ['seed']
    environment:
      DATABASE_URL: postgresql://logs:logs@postgres:5432/logs
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
      node_modules/.bin/prisma migrate deploy &&
      node_modules/.bin/tsx src/scripts/generate-logs.ts --lines 500 --format json-lines --out /tmp/seed.jsonl &&
      node_modules/.bin/tsx src/cli/ingest.ts /tmp/seed.jsonl
      "

volumes:
  pgdata:
